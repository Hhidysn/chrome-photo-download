<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面图片保存</title>
  <link rel="stylesheet" href="panel.css">
  <script type="module" src="panel.mjs"></script>
</head>
<body>
  <a class="skip" href="#gallery">跳到图片列表</a>
  <div class="setup">
  <header>
    <div class="heading"><div><span class="eyebrow">留在这一页</span><h1>图片保存</h1></div><span class="version">1.0</span></div>
    <p id="source-title" class="source-title">在网页上点击扩展图标开始</p>
    <div class="source-line"><span id="source-host">当前网页 · 已加载图片</span><button id="refresh" class="text-button" disabled>刷新图片</button></div>
    <p id="source-warning" class="notice" hidden></p>
  </header>

  <section class="destination" aria-label="保存位置">
    <div class="section-line"><h2>保存到</h2><button id="choose-directory" class="text-button">选择目录</button></div>
    <div class="directory"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5h6l2 2h10v13H3Z"/></svg><span id="directory-name">尚未选择目录</span><span id="permission-tag" class="tag">首次选择</span></div>
    <button id="regrant" class="permission-button" hidden>重新授权这个目录</button>
    <label class="folder-option"><input type="checkbox" id="use-subfolder" checked>按页面标题新建子目录</label>
    <label for="folder-name" class="sr-only">子目录名称</label>
    <input id="folder-name" class="folder-input" type="text" maxlength="200" placeholder="页面标题，可修改" autocomplete="off">
    <p id="destination-preview" class="small muted">选择一次目录，之后可复用</p>
  </section>

  <section class="selection" aria-label="图片范围和选择">
    <div class="section-line"><h2>已加载图片 <span id="total-count" class="count">0</span></h2><span id="duplicate-count" class="small muted"></span></div>
    <div class="filters"><label for="scope" class="sr-only">图片范围</label><select id="scope"><option value="all">全部已加载</option><option value="visible">当前屏幕可见</option></select><label for="minimum" class="sr-only">尺寸筛选</label><select id="minimum"><option value="0">不限尺寸</option><option value="100">最短边 ≥ 100 px</option><option value="300">最短边 ≥ 300 px</option><option value="600">最短边 ≥ 600 px</option></select></div>
    <button id="refresh-visible" class="text-button" hidden>滚动后更新可见范围</button>
    <p id="scan-notes" class="small muted"></p>
    <div class="selection-tools"><button id="select-all" class="text-button">全选</button><button id="invert" class="text-button">反选</button><button id="clear" class="text-button">清空</button><span id="selection-count" class="small">已选 0 张</span></div>
  </section>
  </div>

  <main id="gallery" class="gallery" tabindex="-1" aria-label="图片多选列表"><div id="empty" class="empty"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v18H3Z M3 17l6-6 5 5 3-3 4 4 M15 7h.01"/></svg><p>先打开想保存的网页<br>再点击工具栏里的扩展图标</p></div></main>

  <footer>
    <p id="previous-job" class="notice" hidden></p>
    <p id="status" role="status" aria-live="polite">准备好后，图片会出现在这里</p>
    <progress id="progress" max="1" value="0" hidden aria-label="保存进度"></progress>
    <div class="download-actions"><button id="download-selected" class="primary" disabled>下载所选 · 0</button><button id="download-all" class="secondary" disabled>一键下载全部</button></div>
    <div class="extra-actions"><button id="retry" class="text-button" hidden>重试失败项</button><button id="stop" class="text-button danger" hidden>停止后续保存</button><button id="export-report" class="text-button">导出报告</button></div>
    <p class="footnote">按页面顺序保存原文件 · Shift 连选<br>保存中请保持侧边栏打开</p>
  </footer>
</body>
</html>
