<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面图片保存</title>
  <link rel="stylesheet" href="panel.css">
  <script type="module" src="panel.mjs"></script>
</head>
<body>
  <a class="skip" href="#gallery">跳到图片列表</a>
  <h1 class="sr-only">页面图片保存</h1>

  <!-- 来源与保存目标 -->
  <header class="topbar">
    <div class="source-row">
      <div class="source-info">
        <p id="source-host" class="source-host">未连接页面</p>
        <p id="source-title" class="source-title" title="当前页面标题">在网页上点击扩展图标开始</p>
      </div>
      <button id="refresh" class="icon-btn" disabled title="重新读取当前网页的图片" aria-label="重新读取当前网页的图片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/>
          <path d="M20.5 3.5v6h-6"/>
        </svg>
      </button>
    </div>

    <p id="source-warning" class="notice" hidden></p>

    <div class="target-row">
      <svg class="target-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 7V5h6l2 2h10v13H3Z"/>
      </svg>
      <span id="directory-name" class="target-name">尚未选择目录</span>
      <span id="permission-tag" class="tag">首次选择</span>
      <button id="choose-directory" class="link-btn">选择目录</button>
    </div>

    <button id="regrant" class="link-btn warn regrant" hidden>重新授权这个目录</button>

    <div class="subfolder-row">
      <label class="check-line"><input type="checkbox" id="use-subfolder" checked><span>按标题建子目录</span></label>
      <label class="sr-only" for="folder-name">子目录名称</label>
      <input id="folder-name" class="folder-input" type="text" maxlength="200" placeholder="子目录名称，可修改" autocomplete="off">
    </div>

    <p id="destination-preview" class="path-line">选择一次目录，之后可复用</p>
  </header>

  <!-- 范围、筛选与选择 -->
  <section class="toolbar" aria-label="图片范围和选择">
    <div class="filter-row">
      <label class="sr-only" for="scope">图片范围</label>
      <select id="scope">
        <option value="all">全部已加载</option>
        <option value="visible">当前屏幕可见</option>
      </select>

      <label class="sr-only" for="minimum">尺寸筛选</label>
      <select id="minimum">
        <option value="0">不限尺寸</option>
        <option value="100">最短边 ≥ 100 px</option>
        <option value="300">最短边 ≥ 300 px</option>
        <option value="600">最短边 ≥ 600 px</option>
      </select>

      <button id="refresh-visible" class="quiet-btn" hidden title="滚动网页后按当前视口更新可见范围">更新可见</button>
    </div>

    <div class="tool-row">
      <div class="batch">
        <button id="select-all" class="text-btn">全选</button>
        <button id="invert" class="text-btn">反选</button>
        <button id="clear" class="text-btn">清空</button>
      </div>
      <div class="tool-meta">
        <span class="count-line"><span id="total-count">0</span> 张</span>
        <span id="duplicate-count" class="count-line"></span>
        <span id="selection-count" class="selected-pill">已选 0 张</span>
      </div>
    </div>

    <p id="scan-notes" class="notes-line"></p>
  </section>

  <!-- 图片多选列表 -->
  <main id="gallery" class="gallery" tabindex="-1" aria-label="图片多选列表">
    <div id="empty" class="empty">
      <p class="empty-title">尚未获取图片</p>
      <p class="empty-desc">在目标网页上点击扩展图标，侧边栏会提取页面已加载的图片。</p>
    </div>
  </main>

  <!-- 底部操作 -->
  <footer>
    <p id="previous-job" class="notice" hidden></p>
    <p id="status" role="status" aria-live="polite">准备好后，图片会出现在这里</p>
    <progress id="progress" max="1" value="0" hidden aria-label="保存进度"></progress>

    <div class="actions">
      <button id="download-selected" disabled>下载所选 · 0</button>
      <button id="download-all" disabled>下载全部 · 0</button>
    </div>

    <div class="footer-links">
      <button id="retry" class="link-btn warn" hidden>重试失败项</button>
      <button id="stop" class="link-btn danger" hidden>停止后续保存</button>
      <button id="export-report" class="link-btn subtle">导出报告</button>
    </div>
  </footer>
</body>
</html>
